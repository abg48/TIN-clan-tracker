services:
  bot:
    build: .
    container_name: tin-bot
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SYNC_API_URL=${SYNC_API_URL:-http://localhost:8000}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped
    network_mode: host

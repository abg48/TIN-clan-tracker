services:
  bot:
    build: .
    container_name: tin-bot
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SYNC_API_URL=${SYNC_API_URL:-http://api:8000}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped
    depends_on:
      - api

  api:
    image: localhost:5000/tin-sync:latest
    container_name: tin-api
    environment:
      - DB_PATH=${DB_PATH}
      - SYNC_API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
